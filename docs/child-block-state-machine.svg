<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#777"/>
    </marker>
  </defs>

  <rect width="920" height="590" fill="#fff" rx="4"/>

  <!-- STATE BOXES -->

  <!-- Boot/Init -->
  <rect x="30" y="190" width="120" height="56" rx="28" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="90" y="224" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Boot / Init</text>

  <!-- Ready -->
  <rect x="220" y="180" width="150" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="295" y="210" text-anchor="middle" fill="#1565c0" font-size="17" font-weight="700">Ready</text>
  <text x="295" y="230" text-anchor="middle" fill="#1976d2" font-size="12">STATUS_READY</text>
  <text x="295" y="248" text-anchor="middle" fill="#888" font-size="10">(may include STATUS_IDLE)</text>

  <!-- Busy -->
  <rect x="490" y="190" width="140" height="56" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="560" y="216" text-anchor="middle" fill="#e65100" font-size="17" font-weight="700">Busy</text>
  <text x="560" y="236" text-anchor="middle" fill="#bf360c" font-size="12">STATUS_BUSY</text>

  <!-- Data Ready -->
  <rect x="220" y="395" width="150" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="295" y="421" text-anchor="middle" fill="#2e7d32" font-size="17" font-weight="700">Data Ready</text>
  <text x="295" y="441" text-anchor="middle" fill="#388e3c" font-size="12">STATUS_DATA_READY</text>

  <!-- Error -->
  <rect x="490" y="395" width="140" height="56" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="560" y="421" text-anchor="middle" fill="#c62828" font-size="17" font-weight="700">Error</text>
  <text x="560" y="441" text-anchor="middle" fill="#c62828" font-size="12">STATUS_ERROR</text>

  <!-- Runtime Broadcast overlay -->
  <rect x="690" y="45" width="210" height="175" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="795" y="72" text-anchor="middle" fill="#7b1fa2" font-size="14" font-weight="700">Runtime Broadcast</text>
  <text x="795" y="92" text-anchor="middle" fill="#7b1fa2" font-size="12">(from Brain via I2C)</text>
  <text x="795" y="118" text-anchor="middle" fill="#333" font-size="13">IDLE: identity color</text>
  <text x="795" y="138" text-anchor="middle" fill="#333" font-size="13">RUNNING: step color</text>
  <text x="795" y="158" text-anchor="middle" fill="#333" font-size="13">DONE: green</text>
  <text x="795" y="178" text-anchor="middle" fill="#333" font-size="13">ERROR / STOP: red</text>
  <text x="795" y="203" text-anchor="middle" fill="#666" font-size="11" font-style="italic">LED matrix + status strip only</text>

  <!-- TRANSITIONS -->

  <!-- Boot to Ready -->
  <line x1="150" y1="218" x2="217" y2="218" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="183" y="207" text-anchor="middle" fill="#333" font-size="12" font-style="italic">peripherals</text>
  <text x="183" y="193" text-anchor="middle" fill="#333" font-size="12" font-style="italic">init done</text>

  <!-- Ready to Busy -->
  <line x1="370" y1="210" x2="487" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="428" y="200" text-anchor="middle" fill="#333" font-size="13" font-weight="600">CMD_EXECUTE</text>

  <!-- Busy to Ready -->
  <line x1="490" y1="234" x2="373" y2="234" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text x="428" y="255" text-anchor="middle" fill="#333" font-size="12" font-style="italic">work complete</text>

  <!-- Ready to Data Ready -->
  <line x1="278" y1="260" x2="278" y2="392" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="325" text-anchor="end" fill="#333" font-size="12" font-style="italic">UI submit</text>
  <text x="258" y="342" text-anchor="end" fill="#333" font-size="12" font-style="italic">(event queued)</text>

  <!-- Data Ready to Ready -->
  <line x1="312" y1="395" x2="312" y2="263" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text x="322" y="325" text-anchor="start" fill="#333" font-size="12" font-style="italic">CMD_GET_DATA</text>
  <text x="322" y="342" text-anchor="start" fill="#333" font-size="12" font-style="italic">or CMD_RESET</text>

  <!-- Busy to Error -->
  <line x1="568" y1="246" x2="568" y2="392" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="578" y="325" text-anchor="start" fill="#c62828" font-size="12" font-style="italic">fault</text>

  <!-- Ready to Error -->
  <path d="M370,248 Q440,340 490,415" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="445" y="340" text-anchor="start" fill="#c62828" font-size="12" font-style="italic">invalid config</text>

  <!-- Error to Ready -->
  <path d="M538,395 Q510,320 410,262 Q390,248 373,233" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
  <text x="478" y="303" text-anchor="start" fill="#444" font-size="12" font-style="italic">CMD_RESET</text>

  <!-- Runtime broadcast arrow -->
  <path d="M690,165 Q630,165 570,195" fill="none" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
  <text x="645" y="188" text-anchor="middle" fill="#7b1fa2" font-size="12" font-style="italic">visual update</text>

  <!-- CMD_PING self-loop -->
  <path d="M240,180 Q240,132 295,120 Q350,132 350,180" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="295" y="112" text-anchor="middle" fill="#1565c0" font-size="12" font-style="italic">CMD_PING / GET_STATUS</text>

  <!-- Notes box -->
  <rect x="20" y="478" width="880" height="80" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="498" fill="#333" font-size="12" font-weight="700">Block-type variations:</text>
  <text x="35" y="516" fill="#555" font-size="11">Button: skips Busy on CMD_EXECUTE (arms Execute/Skip UI instead). Reports STATUS_BTN_EXECUTE or STATUS_BTN_SKIP with DATA_READY.</text>
  <text x="35" y="534" fill="#555" font-size="11">Loop / control-flow: instantaneous Busy pulse (same handler), not async. Music: CMD_GET_DATA does not clear DATA_READY; CMD_RESET ignored during playback.</text>
  <text x="35" y="552" fill="#555" font-size="11">Note: clears DATA_READY on any command >= 0x80 (not only CMD_GET_DATA / CMD_RESET). Delay: boots with STATUS_READY | STATUS_IDLE.</text>

</svg>
